services:
  chromium:
    build:
      context: .
      dockerfile: Dockerfile
    image: durian-organization/chromium-railway:local
    container_name: chromium-railway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PUID: "1000"
      PGID: "1000"
      START_DOCKER: "false"
      SELKIES_ALLOWED_ORIGINS: ""
      SELKIES_ENABLE_BASIC_AUTH: "false"
      TITLE: "Chromium"
      CUSTOM_USER: "${CUSTOM_USER:-chromium}"
      PASSWORD: "${PASSWORD:?Set PASSWORD in .env before starting}"
      PORT: "${PORT:-3000}"
      TZ: "${TZ:-Asia/Jakarta}"
      HARDEN_DESKTOP: "${HARDEN_DESKTOP:-true}"
      DISPLAY_SIZEW: "${DISPLAY_SIZEW:-1280}"
      DISPLAY_SIZEH: "${DISPLAY_SIZEH:-720}"
      DISPLAY_REFRESH: "${DISPLAY_REFRESH:-30}"
      SELKIES_MANUAL_RESOLUTION: "${SELKIES_MANUAL_RESOLUTION:-true}"
      SELKIES_MANUAL_WIDTH: "${SELKIES_MANUAL_WIDTH:-1280}"
      SELKIES_MANUAL_HEIGHT: "${SELKIES_MANUAL_HEIGHT:-720}"
      SELKIES_FRAMERATE: "${SELKIES_FRAMERATE:-30-30}"
      SELKIES_FILE_TRANSFERS: "${SELKIES_FILE_TRANSFERS:-upload,download}"
      SELKIES_UI_SIDEBAR_SHOW_FILES: "${SELKIES_UI_SIDEBAR_SHOW_FILES:-true}"
    volumes:
      - ./data:/config
    shm_size: "1gb"
